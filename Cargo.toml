[workspace]
resolver = "2"
members = [
    "crates/codexbar-core",
    "crates/codexbar-providers",
    "crates/codexbar-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["CodexBar Windows port contributors"]

[workspace.dependencies]
codexbar-core = { path = "crates/codexbar-core" }
codexbar-providers = { path = "crates/codexbar-providers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
# `rustls-tls` (not native-tls) so no OpenSSL/Schannel build dependency is needed
# on Windows; `blocking` keeps provider `fetch()` synchronous, which is what the
# `Provider` trait and the tray's background refresh thread expect.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
