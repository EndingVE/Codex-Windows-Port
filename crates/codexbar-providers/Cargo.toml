[package]
name = "codexbar-providers"
description = "Real provider implementations + shared HTTP / credential / OAuth helpers for the CodexBar Windows port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
codexbar-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
# Read-only SQLite access for local provider stores (OpenCode Go's `opencode.db`).
# `bundled` compiles SQLite from source so the port has no system-wide dependency
# and the version is pinned in Cargo.lock.
rusqlite = { version = "0.32", features = ["bundled"] }
# Wipes a `Secret`'s buffer when it is dropped (RECON D10).
zeroize = "1"

# CodexBar's *own* secrets live in Windows Credential Manager (`CredWriteW`)
# with a DPAPI (`CryptProtectData`) file fallback. `windows-sys` is already in
# the dependency graph (via tauri/reqwest), so this adds no new crate — only
# the three API families below.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
# Integration tests build a throwaway fixture database in a temp dir; the crate
# itself only ever opens databases read-only.
rusqlite = { version = "0.32", features = ["bundled"] }

