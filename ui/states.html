<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodexBar — card states</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="states-page">
  <div class="states-wrap">
    <header class="titlebar" style="cursor:default">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <strong>Card states</strong>
          <span class="brand-sub">every FetchStatus the popover can render</span>
        </div>
      </div>
    </header>
    <div class="mode-banner">
      <span class="dot" aria-hidden="true"></span>
      <span>Sample data — this page is evidence, not a shipping surface.</span>
    </div>
    <main class="cards" id="stateCards" style="overflow:visible;flex:none"></main>
    <div class="cards-foot"><span class="legend" id="stateLegend"></span></div>
  </div>

  <script src="mock-states.js"></script>
  <script src="platform.js"></script>
  <script src="format.js"></script>
  <script src="render.js"></script>
  <script src="states.js"></script>
</body>
</html>
