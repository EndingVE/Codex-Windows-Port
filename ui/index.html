<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodexBar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="popover-page">
  <div class="popover" id="popover">
    <header class="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <span class="brand-mark" id="brandMark" aria-hidden="true"></span>
        <div class="brand-text" data-tauri-drag-region>
          <strong>CodexBar</strong>
          <span class="brand-sub" id="brandSub">loading…</span>
        </div>
      </div>
      <div class="titlebar-actions">
        <button class="icon-btn" id="btnRefresh" title="Refresh now (R)" aria-label="Refresh now">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5V6H10"
                  fill="none" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="icon-btn" id="btnSettings" title="Settings… (S)" aria-label="Settings">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M2.6 9.8a5.6 5.6 0 0 1 0-3.6l1.5.3.9-1.5-1-1.2a5.6 5.6 0 0 1 3.1-1.8l.6 1.4h1.6l.6-1.4a5.6 5.6 0 0 1 3.1 1.8l-1 1.2.9 1.5 1.5-.3a5.6 5.6 0 0 1 0 3.6l-1.5-.3-.9 1.5 1 1.2a5.6 5.6 0 0 1-3.1 1.8l-.6-1.4H6.7l-.6 1.4a5.6 5.6 0 0 1-3.1-1.8l1-1.2-.9-1.5-1.5.3Z"
                  fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="icon-btn" id="btnClose" title="Close (Esc)" aria-label="Close">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor"
                  stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="mode-banner" id="modeBanner" role="status">
      <span class="dot" aria-hidden="true"></span>
      <span id="modeText">Sample data — no credentials read, no network calls.</span>
    </div>

    <main class="cards" id="cards" aria-live="polite">
      <p class="placeholder">Loading providers…</p>
    </main>

    <div class="cards-foot" id="cardsFoot">
      <span class="legend" id="legend"></span>
    </div>

    <nav class="footer-actions" aria-label="CodexBar commands">
      <button class="cmd" id="cmdRefresh" type="button">
        <span class="cmd-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="14" height="14">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5V6H10" fill="none"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="cmd-label">Refresh</span>
        <span class="cmd-key" data-shortcut="R">Ctrl R</span>
      </button>
      <button class="cmd" id="cmdSettings" type="button">
        <span class="cmd-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="14" height="14">
            <circle cx="8" cy="8" r="2.1" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 1.4v2M8 12.6v2M1.4 8h2M12.6 8h2M3.3 3.3l1.4 1.4M11.3 11.3l1.4 1.4M12.7 3.3l-1.4 1.4M4.7 11.3l-1.4 1.4"
                  fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="cmd-label">Settings…</span>
        <span class="cmd-key" data-shortcut=",">Ctrl ,</span>
      </button>
      <button class="cmd" id="cmdAbout" type="button">
        <span class="cmd-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="14" height="14">
            <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 7.2v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="8" cy="4.9" r="0.9" fill="currentColor"/>
          </svg>
        </span>
        <span class="cmd-label">About CodexBar</span>
        <span class="cmd-key" id="aboutVersion">v0.1.0</span>
      </button>
      <button class="cmd" id="cmdQuit" type="button">
        <span class="cmd-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="14" height="14">
            <path d="M4.2 2.6h7.6v10.8H4.2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            <path d="M6.3 6.3l3.4 3.4M9.7 6.3l-3.4 3.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="cmd-label">Quit</span>
        <span class="cmd-key" data-shortcut="Q">Ctrl Q</span>
      </button>
    </nav>

    <footer class="statusbar">
      <span id="footLeft">schema v1</span>
      <span id="footRight">—</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="platform.js"></script>
  <script src="mock.js"></script>
  <script src="format.js"></script>
  <script src="render.js"></script>
  <script src="app.js"></script>
</body>
</html>
